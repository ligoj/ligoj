{{- /*
Chart-managed secret: crypto password and/or database password, each emitted
only when no existing Secret is referenced for it.
*/ -}}
{{- $needCrypto := not .Values.crypto.existingSecret -}}
{{- $needDb := or .Values.database.builtin.enabled (not .Values.database.external.existingSecret) -}}
{{- if or $needCrypto $needDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ligoj.secretName" . }}
  labels:
    {{- include "ligoj.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needCrypto }}
  crypto-password: {{ .Values.crypto.password | quote }}
  {{- end }}
  {{- if $needDb }}
  db-password: {{ (ternary .Values.database.builtin.password .Values.database.external.password .Values.database.builtin.enabled) | quote }}
  {{- end }}
{{- end }}
