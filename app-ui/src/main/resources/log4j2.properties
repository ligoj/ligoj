# Properties (not JSON/XML) on purpose:
# - JsonConfigurationFactory needs Jackson 2 (com.fasterxml.*), removed by the Jackson 3 migration.
# - XmlConfigurationFactory uses the JDK DOM parser, which triggers a LinkageError when Log4j
#   initializes inside Spring's SimpleThrowawayClassLoader (JPA temp classloader in app-api and
#   downstream plugin tests): that child-first loader re-defines org.xml.sax.* from the jrt image
#   (not in OverridingClassLoader's excluded packages), clashing with java.xml's DocumentBuilder
#   signature. Kept aligned with app-api's config format.
# The properties factory is parsed by Log4j itself with no external dependency.
status = warn
name = Main
monitorInterval = 60

property.filename = ${env:LIGOJ_HOME:-${sys:ligoj.home:-target}}/${sys:ligoj.log.file.name:-ui-rolling.log}

filter.threshold.type = ThresholdFilter
filter.threshold.level = debug

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%principal] %msg%n

appender.verbose.type = Console
appender.verbose.name = STDOUT_VERBOSE
appender.verbose.layout.type = PatternLayout
appender.verbose.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [%principal] %logger{36} - %msg%n

# Routing: an actual rolling file when ligoj.log.file.enabled (default), else a Null sink.
appender.routing.type = Routing
appender.routing.name = MaybeRolling
appender.routing.routes.type = Routes
appender.routing.routes.pattern = ${sys:ligoj.log.file.enabled:-true}
appender.routing.routes.file.type = Route
appender.routing.routes.file.key = true
appender.routing.routes.file.app.type = RollingFile
appender.routing.routes.file.app.name = RollingFileActive
appender.routing.routes.file.app.fileName = ${filename}
appender.routing.routes.file.app.filePattern = ${filename}.%i.gz
appender.routing.routes.file.app.layout.type = PatternLayout
appender.routing.routes.file.app.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level [%principal] %logger{36} - %msg%n
appender.routing.routes.file.app.policies.type = Policies
appender.routing.routes.file.app.policies.size.type = SizeBasedTriggeringPolicy
appender.routing.routes.file.app.policies.size.size = ${sys:ligoj.log.file.size:-10 MB}
appender.routing.routes.nofile.type = Route
appender.routing.routes.nofile.key = false
appender.routing.routes.nofile.app.type = Null
appender.routing.routes.nofile.app.name = NoFile

logger.userdetails.name = org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer$InitializeUserDetailsManagerConfigurer
logger.userdetails.level = error
logger.userdetails.additivity = false
logger.userdetails.appenderRef.stdout.ref = STDOUT

logger.security.name = org.springframework.security
logger.security.level = warn
logger.security.additivity = false
logger.security.appenderRef.stdout.ref = STDOUT

logger.jettyhttp.name = org.eclipse.jetty.server.HttpChannel
logger.jettyhttp.level = ${sys:log4j2.jetty.http.level:-warn}
logger.jettyhttp.additivity = false
logger.jettyhttp.appenderRef.verbose.ref = STDOUT_VERBOSE

logger.jettyserver.name = org.eclipse.jetty.server.Server
logger.jettyserver.level = ${sys:log4j2.jetty.server.level:-debug}
logger.jettyserver.additivity = false
logger.jettyserver.appenderRef.verbose.ref = STDOUT_VERBOSE

logger.jettydesc.name = org.eclipse.jetty.webapp.StandardDescriptorProcessor
logger.jettydesc.level = warn
logger.jettydesc.additivity = false
logger.jettydesc.appenderRef.stdout.ref = STDOUT

rootLogger.level = ${sys:log.level:-info}
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.rolling.ref = MaybeRolling
